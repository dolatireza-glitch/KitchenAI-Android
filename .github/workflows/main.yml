
name: Build Kitchen AI APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q KitchenAI_CloudBuild_Starter.zip -d /tmp/kitchen
          cp -a /tmp/kitchen/KitchenAI_CloudBuild_Starter/app .
          cp /tmp/kitchen/KitchenAI_CloudBuild_Starter/build.gradle .
          cp /tmp/kitchen/KitchenAI_CloudBuild_Starter/settings.gradle .
          cp /tmp/kitchen/KitchenAI_CloudBuild_Starter/gradle.properties .

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KitchenAI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
